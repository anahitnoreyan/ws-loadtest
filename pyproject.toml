[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsload"
version = "0.1.0"
description = "Asyncio-based WebSocket load-testing tool: concurrency, latency and throughput."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsload = "wsload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
